language: go

go:
  - 1.5
  - tip

before_deploy:
  - bash scripts/fetch-geosite.sh
  - GOARCH=amd64 GOOS=windows go build -o TcpRoute2-windows-amd64.exe

deploy:
  provider: releases
  api_key: $CI_USER_TOKEN
  skip_cleanup: true
  file:
    - TcpRoute2-windows-amd64.exe
    - assets/geosite.dat
  on:
    tags: true
    all_branches: true
    go: tip
